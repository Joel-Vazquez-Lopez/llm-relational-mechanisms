<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 630" width="1140" height="630" role="img"><title>Supplement S2. Frozen positional-shortcut baseline</title><rect width="1140" height="630" fill="white"/><text x="52" y="51" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#008c87" font-weight="700">SUPPLEMENT S2 / POST-HOC POSITIONAL BASELINES</text><text x="52" y="95" font-family="Arial,sans-serif" font-size="29" text-anchor="start" fill="#162a49" font-weight="700">Position predicts the gap — not the full error pattern</text><text x="52" y="125" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#64748b" font-weight="400">Same 144 EXP-109 development anchors; different inference units for neural vs deterministic rules.</text><text x="52" y="183" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#162a49" font-weight="700">PA − AP joint accuracy gap</text><text x="52" y="228" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#162a49" font-weight="400">Transformer (8-seed mean)</text><rect x="318" y="210" width="368.22918749999997" height="29" fill="#162a49"/><text x="694.2291875" y="230" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#162a49" font-weight="700">61.4 pp</text><text x="52" y="283" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#162a49" font-weight="400">Raw mention index</text><rect x="318" y="265" width="266.66666666666663" height="29" fill="#ee9d38"/><text x="592.6666666666666" y="285" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#162a49" font-weight="700">44.4 pp</text><text x="52" y="338" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#162a49" font-weight="400">Core-slot (oracle segmented)</text><rect x="318" y="320" width="600" height="29" fill="#008c87"/><text x="926" y="340" font-family="Arial,sans-serif" font-size="15" text-anchor="start" fill="#162a49" font-weight="700">100.0 pp</text><text x="52" y="423" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#162a49" font-weight="700">AP second-event paired responses</text><text x="52" y="472" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#162a49" font-weight="400">Transformer (8-seed mean)</text><rect x="318" y="455" width="66.40625" height="26" fill="#008c87"/><text x="351.203125" y="473" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">11.1%</text><rect x="384.40625" y="455" width="247.13541666666666" height="26" fill="#ee9d38"/><text x="507.9739583333333" y="473" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">41.2%</text><rect x="631.5416666666666" y="455" width="128.125" height="26" fill="#6d59a6"/><text x="695.6041666666666" y="473" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">21.4%</text><rect x="759.6666666666666" y="455" width="158.33333333333334" height="26" fill="#b6534d"/><text x="838.8333333333333" y="473" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">26.4%</text><text x="52" y="507" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#162a49" font-weight="400">Raw mention index</text><rect x="318" y="490" width="0" height="26" fill="#008c87"/><rect x="318" y="490" width="400" height="26" fill="#ee9d38"/><text x="518" y="508" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">66.7%</text><rect x="718" y="490" width="0" height="26" fill="#6d59a6"/><rect x="718" y="490" width="200" height="26" fill="#b6534d"/><text x="818" y="508" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">33.3%</text><text x="52" y="542" font-family="Arial,sans-serif" font-size="14" text-anchor="start" fill="#162a49" font-weight="400">Core-slot (oracle segmented)</text><rect x="318" y="525" width="0" height="26" fill="#008c87"/><rect x="318" y="525" width="600" height="26" fill="#ee9d38"/><text x="618" y="543" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="700">100.0%</text><rect x="918" y="525" width="0" height="26" fill="#6d59a6"/><rect x="918" y="525" width="0" height="26" fill="#b6534d"/><rect x="318" y="576" width="12" height="12" fill="#008c87"/><text x="337" y="587" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#64748b" font-weight="400">Both correct</text><rect x="488" y="576" width="12" height="12" fill="#ee9d38"/><text x="507" y="587" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#64748b" font-weight="400">Reversed</text><rect x="658" y="576" width="12" height="12" fill="#6d59a6"/><text x="677" y="587" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#64748b" font-weight="400">Same person</text><rect x="828" y="576" width="12" height="12" fill="#b6534d"/><text x="847" y="587" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#64748b" font-weight="400">Wrong event</text><text x="52" y="614" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#b6534d" font-weight="400">Core-slot baseline has hand-crafted argument segmentation; results are descriptive, not a causal mechanism test.</text></svg>
