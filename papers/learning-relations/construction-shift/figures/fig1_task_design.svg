<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-label="Figure 1. Controlled grammar and exposure design"><title>Figure 1. Controlled grammar and exposure design</title><desc>Experimental schedule and paired literal clause-reordering conditions.</desc><rect x="0" y="0" width="1100" height="680" rx="0" fill="#ffffff" stroke="#ffffff" /><text x="58" y="50" font-family="Inter,Arial,sans-serif" font-size="14" fill="#008c87" font-weight="700" text-anchor="start">FIGURE 1</text><text x="58" y="93" font-family="Inter,Arial,sans-serif" font-size="31" fill="#162a49" font-weight="750" text-anchor="start">Task, construction shift and exposure arms</text><text x="58" y="123" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">A = active clause; P = passive clause. Each example contains two events and four distinct participants.</text><rect x="58" y="159" width="238" height="100" rx="11" fill="#eef3f8" stroke="#dde5ef" /><text x="74" y="191" font-family="Inter,Arial,sans-serif" font-size="28" fill="#162a49" font-weight="750" text-anchor="start">AA</text><text x="74" y="216" font-family="Inter,Arial,sans-serif" font-size="15" fill="#162a49" font-weight="400" text-anchor="start">Active → Active</text><text x="74" y="244" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Training-source grammar</text><rect x="315" y="159" width="238" height="100" rx="11" fill="#eef3f8" stroke="#dde5ef" /><text x="331" y="191" font-family="Inter,Arial,sans-serif" font-size="28" fill="#162a49" font-weight="750" text-anchor="start">PA</text><text x="331" y="216" font-family="Inter,Arial,sans-serif" font-size="15" fill="#162a49" font-weight="400" text-anchor="start">Passive → Active</text><text x="331" y="244" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Training-source grammar</text><rect x="572" y="159" width="238" height="100" rx="11" fill="#e7f8f6" stroke="#008c87" /><text x="588" y="191" font-family="Inter,Arial,sans-serif" font-size="28" fill="#008c87" font-weight="750" text-anchor="start">AP</text><text x="588" y="216" font-family="Inter,Arial,sans-serif" font-size="15" fill="#162a49" font-weight="400" text-anchor="start">Active → Passive</text><text x="588" y="244" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Transfer / held-out target</text><rect x="829" y="159" width="238" height="100" rx="11" fill="#eef3f8" stroke="#dde5ef" /><text x="845" y="191" font-family="Inter,Arial,sans-serif" font-size="28" fill="#162a49" font-weight="750" text-anchor="start">PP</text><text x="845" y="216" font-family="Inter,Arial,sans-serif" font-size="15" fill="#162a49" font-weight="400" text-anchor="start">Passive → Passive</text><text x="845" y="244" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Training-source grammar</text><text x="58" y="312" font-family="Inter,Arial,sans-serif" font-size="20" fill="#162a49" font-weight="700" text-anchor="start">Literal AP ↔ PA clause swap</text><rect x="58" y="333" width="470" height="83" rx="8" fill="#fbfaf8" stroke="#e5e7eb" /><rect x="568" y="333" width="470" height="83" rx="8" fill="#fbfaf8" stroke="#e5e7eb" /><text x="86" y="361" font-family="Inter,Arial,sans-serif" font-size="18" fill="#162a49" font-weight="600" text-anchor="start">AP: [Event 1 active] [Event 2 passive]</text><text x="86" y="393" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Query references first / second event</text><text x="596" y="361" font-family="Inter,Arial,sans-serif" font-size="18" fill="#162a49" font-weight="600" text-anchor="start">PA: [Event 2 passive] [Event 1 active]</text><text x="596" y="393" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Same clauses; order and references change</text><line x1="531" y1="371" x2="564" y2="371" stroke="#008c87" stroke-width="3"/><text x="543" y="357" font-family="Inter,Arial,sans-serif" font-size="17" fill="#008c87" font-weight="700" text-anchor="start">⇄</text><text x="58" y="472" font-family="Inter,Arial,sans-serif" font-size="20" fill="#162a49" font-weight="700" text-anchor="start">Matched training schedules (per update)</text><rect x="58" y="493" width="325" height="104" rx="8" fill="#e2edf7" stroke="#d6dfe9" /><text x="73" y="521" font-family="Inter,Arial,sans-serif" font-size="16" fill="#162a49" font-weight="700" text-anchor="start">PA-only baseline</text><text x="73" y="548" font-family="Inter,Arial,sans-serif" font-size="16" fill="#162a49" font-weight="500" text-anchor="start">7 AA + 7 PA + 2 PA</text><text x="73" y="577" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Four answers per source</text><rect x="403" y="493" width="325" height="104" rx="8" fill="#e6f7f4" stroke="#d6dfe9" /><text x="418" y="521" font-family="Inter,Arial,sans-serif" font-size="16" fill="#162a49" font-weight="700" text-anchor="start">Indirect PP+AA</text><text x="418" y="548" font-family="Inter,Arial,sans-serif" font-size="16" fill="#162a49" font-weight="500" text-anchor="start">7 AA + 7 PA + PP + AA</text><text x="418" y="577" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Four answers per source</text><rect x="748" y="493" width="325" height="104" rx="8" fill="#fff4e6" stroke="#d6dfe9" /><text x="763" y="521" font-family="Inter,Arial,sans-serif" font-size="16" fill="#162a49" font-weight="700" text-anchor="start">Direct PA+AP</text><text x="763" y="548" font-family="Inter,Arial,sans-serif" font-size="16" fill="#162a49" font-weight="500" text-anchor="start">7 AA + 7 PA + PA + AP</text><text x="763" y="577" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Four answers per source</text><text x="58" y="644" font-family="Inter,Arial,sans-serif" font-size="14" fill="#b6534d" font-weight="400" text-anchor="start">Caveat: exposure conditions are not perfectly matched for sentence length, positions or source-level co-occurrence.</text></svg>
