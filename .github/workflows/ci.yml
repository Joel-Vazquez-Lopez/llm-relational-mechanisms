name: tests
on:
  push:
  pull_request:

jobs:
  # Fast checks for every change: pure-Python and NumPy tests. Tests that need
  # PyTorch/Transformers skip here and run in the scientific job below.
  lightweight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8" "numpy>=1.26"
      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q -rs --junitxml=lightweight.xml tests
      - name: Report passed, skipped and failed
        if: always()
        run: python .github/scripts/test_report.py lightweight.xml --title "Lightweight (Python ${{ matrix.python-version }})" --summary "$GITHUB_STEP_SUMMARY"
      - name: Synthetic diagnostic smoke test
        run: PYTHONPATH=src python -m relational_lab.analysis examples/toy_counterfactual.json

  # Scientific CPU validation: the PyTorch / Transformers / Tokenizers / Accelerate
  # tests (scoring, patching, chat templates, device maps, OTR-01..15 runners) on tiny
  # randomly initialised models built in the tests. No pretrained weights are downloaded
  # (the Hugging Face Hub is set offline) and no evaluation split is opened.
  # Versions follow the ones recorded in the OTR result files (torch 2.15, transformers 5.23).
  scientific-cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and the Hugging Face stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.15,<2.16"
          python -m pip install "transformers>=5.23,<6" "tokenizers>=0.22" "accelerate>=1.10" \
            "matplotlib>=3.8" "pytest>=8" "numpy>=1.26"
          python -c "import torch, transformers, tokenizers, accelerate; print('torch', torch.__version__, '| transformers', transformers.__version__, '| tokenizers', tokenizers.__version__, '| accelerate', accelerate.__version__)"
      - name: Run unit tests on tiny synthetic models
        run: PYTHONPATH=src python -m pytest -q -rs --junitxml=scientific.xml tests
      - name: Report passed, skipped and failed
        if: always()
        # Only the spaCy extraction tests may skip here (they need a pretrained spaCy parser).
        run: python .github/scripts/test_report.py scientific.xml --title "Scientific CPU validation" --allow-skip "spacy|en_core_web_sm|lemminflect" --summary "$GITHUB_STEP_SUMMARY"
