name: Paper I PR14 isolated scientific audit
on:
  push:
    branches: [audit/paper-i-pr14-clean-checkout-v0]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts:src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only scientific dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'matplotlib>=3.8,<4' 'pandas>=2.1,<3'
          python -c 'import torch,numpy; print(torch.__version__, numpy.__version__)'
      - name: Static tree, manifests, report content and read-only recomputation
        id: static
        continue-on-error: true
        run: python audit/paper_i_pr14_audit.py
      - name: Existing unit and diagnostic tests
        id: unit
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m relational_lab.analysis examples/toy_counterfactual.json
      - name: Reviewed toy CPU smoke checks only
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failures=0
          for name in role_circuit_diagnostics_v0 role_representation_localisation_v0 role_causal_routing_v0 role_causal_pathways_v0 role_binding_causal_validation_v0 role_binding_localisation_v0 role_mechanism_replication_v0 role_mechanism_discovery_v1 role_mechanism_repair_v0 role_repair_specificity_v1 role_learning_origins_v0; do
            timeout 120 python "scripts/${name}.py" --phase smoke
            rc=$?
            echo "SMOKE_STATUS ${name} ${rc}"
            if [ "$rc" -ne 0 ]; then failures=$((failures+1)); fi
          done
          exit "$failures"
      - name: Construction-shift read-only figure provenance and regeneration
        id: figures
        continue-on-error: true
        run: |
          python papers/learning-relations/construction-shift/scripts/check_figure_data.py
          python papers/learning-relations/construction-shift/scripts/render_figures.py
          git diff --exit-code
      - name: Upload isolated audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-i-pr14-audit
          path: /tmp/paper-i-pr14-audit.json
          if-no-files-found: warn
      - name: Propagate audit outcomes
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          FIGURES: ${{ steps.figures.outcome }}
        run: |
          echo "AUDIT_OUTCOMES $STATIC $UNIT $SMOKE $FIGURES"
          test "$STATIC $UNIT $SMOKE $FIGURES" = "success success success success"
