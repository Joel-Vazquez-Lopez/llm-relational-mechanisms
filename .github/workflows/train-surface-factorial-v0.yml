name: TRAIN-SURFACE-FACTORIAL-v0 preflight (source only)
on:
  push:
    branches: [experiments/train-surface-factorial-v0]
    paths:
      - 'scripts/train_surface_factorial_v0_preflight.py'
      - '.github/workflows/train-surface-factorial-v0.yml'
      - 'scripts/train_surface_factorial_v0.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source generator
        run: python -m py_compile scripts/train_surface_factorial_v0_preflight.py scripts/train_surface_factorial_v0.py
          bash -n scripts/run_train_surface_factorial_v0.sh
      - name: Source parsing, overlap, token-length and nuisance audit
        run: python scripts/train_surface_factorial_v0_preflight.py --phase prepare
      - name: Install CPU torch for throwaway-model smoke
        run: python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify study manifest and all frozen seed schedules
        run: python scripts/train_surface_factorial_v0.py --phase prepare
      - name: CPU random-weight train-only optimizer and score smoke
        run: python scripts/train_surface_factorial_v0.py --phase smoke --device cpu
      - name: Upload source manifest for review (not yet frozen)
        uses: actions/upload-artifact@v4
        with:
          name: surface-factorial-source-only-report
          path: |
            reports/train_surface_factorial_v0/source_manifest.json
            reports/train_surface_factorial_v0/study_manifest.json
